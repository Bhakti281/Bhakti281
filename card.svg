<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0b1020"/><stop offset="55%" stop-color="#0d1117"/><stop offset="100%" stop-color="#111b2e"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#1f6feb"/><stop offset="50%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#79c0ff"/>
